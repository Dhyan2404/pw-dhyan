name: Build PW DHYAN APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Wrapper Ready
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Direct APK
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/PW-DHYAN.apk

      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: PW-DHYAN-App-Debug
          path: release_apk/PW-DHYAN.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "PW DHYAN Official APK (Direct Download)"
          body: |
            ### 🚀 PW DHYAN Latest Android App
            
            **Direct Download link (No ZIP needed!)**:
            Tap the `PW-DHYAN.apk` link below directly from your Android phone to download and install immediately!
            
            - Built from commit: `${{ github.sha }}`
            - Features: Real-time Cloud Passkeys, Batch Generator, Native PDF/DPP Downloader, Live Notices & Screen WakeLock.
          files: release_apk/PW-DHYAN.apk
          prerelease: false
          make_latest: true
