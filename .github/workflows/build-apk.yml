name: Build PW DHYAN APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Wrapper Ready
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Build Debug APK
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug -x lint -x test --no-daemon --stacktrace 2>&1 | tee build_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "## ❌ Gradle Build Failed (Exit Code: $EXIT_CODE)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E -C 4 "e: |error:|FAILED" build_output.txt | head -n 120 >> $GITHUB_STEP_SUMMARY || tail -n 80 build_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ERR_MSG=$(grep -E "e: |error:|FAILURE:|FAILED" build_output.txt | head -n 6 | tr '\r\n' '  ')
            if [ -z "$ERR_MSG" ]; then
              ERR_MSG=$(tail -n 10 build_output.txt | tr '\r\n' '  ')
            fi
            echo "::error title=Gradle Error::$ERR_MSG"
            exit $EXIT_CODE
          fi

      - name: Upload Build Reports & Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-log
          if-no-files-found: ignore
          path: |
            build_output.txt
            app/build/reports/

      - name: Prepare Direct APK & ZIP
        shell: bash
        run: |
          set -e
          mkdir -p release_apk
          APK_SRC=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "::error::No APK found in app/build/outputs/apk/debug/"
            exit 1
          fi
          cp "$APK_SRC" release_apk/PW-DHYAN.apk
          cd release_apk
          zip -9 PW-DHYAN-Direct.zip PW-DHYAN.apk
          ls -lh
          cd ..

      - name: Upload Artifact (Backup APK & ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: PW-DHYAN-Package
          path: |
            release_apk/PW-DHYAN.apk
            release_apk/PW-DHYAN-Direct.zip

      - name: Publish Direct APK & ZIP to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "PW DHYAN Official Release (Direct APK & ZIP)"
          body: |
            ### 🚀 PW DHYAN Latest Android App
            
            **Direct Download Links**:
            - 📲 **Direct APK** (No unzipping required): [PW-DHYAN.apk](https://github.com/Dhyan2404/pw-dhyan/releases/download/v1.0.${{ github.run_number }}/PW-DHYAN.apk)
            - 📦 **Direct ZIP**: [PW-DHYAN-Direct.zip](https://github.com/Dhyan2404/pw-dhyan/releases/download/v1.0.${{ github.run_number }}/PW-DHYAN-Direct.zip)
            
            - Built from commit: `${{ github.sha }}`
            - Mobile-optimized Liquid Player with responsive 10s skip & slim layout
            - Sensor Landscape mode enabled by default for widescreen lectures
            - Non-blocking Background PDF & DPP downloader
            - Master passcode `240411` + Admin-only generated Passkeys (Phone time bypass removed)
            - Admin Push Notifications & 10x Motivation Spam
          files: |
            release_apk/PW-DHYAN.apk
            release_apk/PW-DHYAN-Direct.zip
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: true

      - name: Push Build Log to branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/buildlog_work
          cd /tmp/buildlog_work
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git init
          git checkout -b build-log
          cp "$GITHUB_WORKSPACE/build_output.txt" log.txt 2>/dev/null || echo "No build output" > log.txt
          git add log.txt
          git commit -m "Build log for ${{ github.sha }}" || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin build-log || true

